name: miracle-wm
adopt-info: miracle-wm
summary: "A hackable Wayland window manager built on Mir"
description: |
  miracle-wm is a hackable, stylish, and modern Wayland compositor built on Mir. It brings the keyboard-driven efficiency of i3/Sway to a richer, more extensible experience with smooth animations, a powerful WebAssembly plugin system, and a clean YAML configuration.
confinement: classic
base: core26
version: 0.0.0
grade: stable

platforms:
  amd64:
  arm64:
  armhf:

package-repositories:
  - type: apt
    ppa: mir-team/release

apps:
  miracle-wm:
    command: usr/bin/miracle-wm
    environment: &_environment # Prep for Mir
      MIR_SERVER_PLATFORM_PATH: ${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/mir/server-platform
      __EGL_VENDOR_LIBRARY_DIRS: ${SNAP}/etc/glvnd/egl_vendor.d:${SNAP}/usr/share/glvnd/egl_vendor.d
      GBM_BACKENDS_PATH: ${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gbm
      LIBGL_DRIVERS_PATH: ${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/dri
      LIBINPUT_QUIRKS_DIR: ${SNAP}/usr/share/libinput
      PATH: ${SNAP}/bin/:${SNAP}/usr/bin/:${SNAP}/usr/local/bin/:${PATH}
      DRIRC_CONFIGDIR: ${SNAP}/usr/share/drirc.d

  miracle-wm-sensible-terminal:
    command: usr/bin/miracle-wm-sensible-terminal
    environment: *_environment

  miraclemsg:
    command: usr/bin/miraclemsg
    environment: *_environment

  miracle-wm-basic-error-reporter:
    command: usr/bin/miracle-wm-basic-error-reporter
    environment: *_environment

parts:
  miracle-wm:
    build-attributes:
      - enable-patchelf
    # Override pull will set the version either to the tag+hash or the tag itself.
    # If the tag is the currently published tag, then we set the grade to stable.
    # Otherwise, the grade is always devel.
    override-pull: |
      craftctl default
      git config --global --add safe.directory ${CRAFT_PART_SRC}
      published=`git describe --tags --abbrev=0`
      version=`git describe --tags`
      craftctl set version=$version
      if [[ "$published" != *"$version"* ]]; then craftctl set grade=devel; else craftctl set grade=stable; fi
    plugin: cmake
    cmake-parameters:
      - -DSNAP_BUILD=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    source: .
    override-build: |
      apt-get install -y libmirrenderer-dev || true
      apt-get install -y mir-renderer-gl-dev || true
      craftctl default
    build-packages:
      - pkg-config
      - libmiral-dev
      - libmircommon-dev
      - libmirserver-internal-dev
      - mirtest-dev
      - mirtest-internal-dev
      - libmirplatform-dev
      - libfreetype6-dev
      - libwayland-dev
      - libxkbcommon-dev
      - g++
      - make
      - git
      - libgtest-dev
      - libyaml-cpp-dev
      - libyaml-cpp0.8
      - libglib2.0-dev
      - libglib2.0-0
      - libevdev-dev
      - libevdev2
      - nlohmann-json3-dev
      - libgles2-mesa-dev
      - libmirwayland-dev
      - libjson-c-dev
      - libgtest-dev
      - libgmock-dev
      - libboost-filesystem-dev
      - libboost-system-dev
      - libwasmedge-dev
      # miracle-wm-basic-error-reporter (GTK4 client)
      - libgtk-4-dev
      - libgtk4-layer-shell-dev
      - gettext
    stage-packages:
      - libmiral7
      - mir-graphics-drivers-desktop
      - mir-platform-graphics-virtual
      - mir-graphics-drivers-nvidia
      - pcre2-utils
      - python3-tenacity
      - python3-dbus-next
      - libgl1-mesa-dri
      - libdrm-nouveau2
      - libwasmedge0
      # miracle-wm-basic-error-reporter (GTK4 client) runtime
      - libgtk-4-1
      - libgtk4-layer-shell0
      - libjson-c5
      - adwaita-icon-theme
    prime:
      - -lib/udev
      - -usr/doc
      - -usr/doc-base
      - -usr/share/applications
      - -usr/share/apport
      - -usr/share/bug
      - -usr/share/doc
      - -usr/share/doc-base
      - -usr/share/icons
      - -usr/share/libdrm
      - -usr/share/libwacom
      - -usr/share/lintian
      - -usr/share/man
      - -usr/share/pkgconfig
      - -usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libgallium*
      - -usr/include
      - -usr/lib/*/pkgconfig

  session:
    plugin: dump
    source: session

  mesa-no-patchelf:
    plugin: nil
    stage-packages:
      - mesa-libgallium
    build-attributes:
      - no-patchelf # Otherwise snapcraft may strip the build ID and cause the driver to crash
    stage:
      - usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libgallium*
