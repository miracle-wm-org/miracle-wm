name: Publish to PPA

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-ppa:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git log

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts build-essential dh-make debhelper-compat

    - name: Set up GPG
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --import --batch --yes
        echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --quick-set-primary-uid "$GPG_KEY_ID"
        
    - name: Configure dput
      run: |
        mkdir -p ~/.dput.d
        cat > ~/.dput.d/profiles.json << EOF
        {
          "DEFAULT": {
            "method": "ftp",
            "fqdn": "ppa.launchpad.net",
            "login": "anonymous",
            "incoming": "~matthew-kosarek/ubuntu/miracle-wm/"
          }
        }
        EOF

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set up environment variables
      env:
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      run: |
        echo "DEBEMAIL=matthew@matthewkosarek.xyz" >> $GITHUB_ENV
        echo "DEBFULLNAME=Matthew Kosarek" >> $GITHUB_ENV
        echo "GPGKEY=$GPG_KEY_ID" >> $GITHUB_ENV

    - name: Configure git
      run: |
        git config user.name "miracle-wm-bot"
        git config user.email "matthew@matthewkosarek.xyz"

    - name: Update changelog and move tag
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Update the main repo's changelog
        DEBEMAIL="matthew@matthewkosarek.xyz" DEBFULLNAME="Matthew Kosarek" dch -v ${VERSION}-1 "Release version $VERSION"
        
        # Add recent commits (get commits since last tag)
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "HEAD~5")
        git log --oneline --no-merges ${LAST_TAG}..HEAD | head -5 | while read commit; do
          if [ -n "$commit" ]; then
            commit_msg=$(echo "$commit" | sed 's/^[a-f0-9]* //')
            DEBEMAIL="matthew@matthewkosarek.xyz" DEBFULLNAME="Matthew Kosarek" dch -a "* $commit_msg"
          fi
        done
        
        # Commit the changelog update (but don't move the tag)
        git add debian/changelog
        git commit -m "Update changelog for version $VERSION [skip ci]"
        
        # Push the new commit (tag stays where it was)
        git push origin HEAD

    - name: Publish to PPA
      run: |
        chmod +x tools/publish-ppa.sh
        tools/publish-ppa.sh ${{ steps.get_version.outputs.version }} noble questing