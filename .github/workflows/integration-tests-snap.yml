name: Integration Tests (Snap)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number && format('pr{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  visual-tests-snap:
    runs-on: ubuntu-latest
    name: Visual Integration Tests (snap)
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: build-snap
        name: Build snap
        uses: canonical/actions/build-snap@release
        with:
          snapcraft-channel: candidate
          review-opts: "--allow-classic"

      - name: Store the snap as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snap.outputs.snap-name }}
          path: ${{ steps.build-snap.outputs.snap-path }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            python3 python3-venv python3-pip \
            gedit gnome-chess grim

      - name: Install snap
        run: |
          sudo snap install --dangerous --classic ${{ steps.build-snap.outputs.snap-path }}

      - name: Install Python e2e test deps
        run: |
          cd e2e
          python3 -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: Run visual e2e tests against snap
        run: |
          set -eo pipefail
          mkdir -p /tmp/miracle-e2e
          chmod 700 /tmp/miracle-e2e
          mkdir -p ${{ github.workspace }}/screenshots-snap
          cd e2e
          . venv/bin/activate
          XDG_RUNTIME_DIR=/tmp/miracle-e2e \
          MIRACLE_VISUAL_TEST_BIN=/snap/bin/miracle-wm \
          MIRACLE_SCREENSHOT_DIR=${{ github.workspace }}/screenshots-snap \
          MIRACLE_PLATFORM_DISPLAY_LIBS=mir:virtual \
          MIR_SERVER_VIRTUAL_OUTPUT=800x600 \
          pytest visual/ -v --tb=short 2>&1 | tee ${{ github.workspace }}/screenshots-snap/test-output.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-snap-screenshots-${{ github.run_number }}
          path: ${{ github.workspace }}/screenshots-snap/
          retention-days: 30
          if-no-files-found: warn
