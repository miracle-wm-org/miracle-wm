name: Build & Test - Ubuntu

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  BUILD_TYPE: Debug
  CONTAINER: miracle-build

jobs:

  build-and-test:
    strategy:
      matrix:
        ppa: [release, rc]
        compiler: [gcc, clang]

    runs-on: ubuntu-24.04
    name: Ubuntu Build & Test
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v3

    - name: Install podman
      run: |
        sudo apt-get update -q
        sudo apt-get install -y podman

    - name: Start Ubuntu 26.04 container
      run: |
        podman run -d --name ${{ env.CONTAINER }} \
          --privileged \
          -v ${{ github.workspace }}:/workspace:z \
          --workdir /workspace \
          ubuntu:26.04 \
          sleep infinity

    - name: Add PPA
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          apt-get update -q
          apt-get install -yq software-properties-common
          add-apt-repository ppa:mir-team/${{ matrix.ppa }}
          apt-get update -q
        "

    - name: Install dependencies
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            gcc g++ clang libclang-dev cmake ninja-build python3 curl \
            libmiral-dev libmircommon-dev libmirserver-internal-dev \
            libgtest-dev libyaml-cpp-dev libglib2.0-dev libevdev-dev nlohmann-json3-dev \
            libnotify-dev pcre2-utils libmiroil-dev libmirplatform-dev libgles2-mesa-dev \
            libmirwayland-dev libjson-c-dev libgmock-dev mirtest-dev mirtest-internal-dev \
            mir-wlcs-integration libxkbcommon-dev libboost-filesystem-dev libboost-system-dev \
            libwasmedge-dev
          DEBIAN_FRONTEND=noninteractive apt-get install -yq libmirrenderer-dev || true
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            mir-platform-graphics-virtual xwayland \
            mir-platform-graphics-gbm-kms mir-platform-rendering-egl-generic gedit gnome-chess
        "

    - name: Install Rust
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . /root/.cargo/env
          rustup target add wasm32-unknown-unknown
        "

    - name: Configure CMake
      run: |
        EXTRA_FLAGS=""
        if [ "${{ matrix.ppa }}" = "dev" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS -DCOMPILING_AGAINST_DEV=1"
        fi
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
        fi
        podman exec ${{ env.CONTAINER }} \
          cmake -B /workspace/build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DEND_TO_END_TESTS=1 \
            $EXTRA_FLAGS

    - name: Build
      run: podman exec ${{ env.CONTAINER }} cmake --build /workspace/build --config ${{ env.BUILD_TYPE }}

    - name: Install
      run: podman exec ${{ env.CONTAINER }} cmake --install /workspace/build --config ${{ env.BUILD_TYPE }}

    - name: Unit Tests
      run: podman exec -e XDG_RUNTIME_DIR=/tmp ${{ env.CONTAINER }} /workspace/build/tests/miracle-wm-tests

    - name: miracle-wm-config unit tests
      run: podman exec -e XDG_RUNTIME_DIR=/tmp ${{ env.CONTAINER }} /workspace/build/miracle-wm-c/test_miracle_wm_c_api

    - name: Build miracle-plugin-rs
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          . /root/.cargo/env
          cargo build --manifest-path /workspace/miracle-plugin-rs/Cargo.toml --target wasm32-unknown-unknown
        "

    - name: Check Licenses
      run: podman exec ${{ env.CONTAINER }} python3 /workspace/tools/check_license.py

    - name: Stop container
      if: always()
      run: |
        podman stop ${{ env.CONTAINER }} || true
        podman rm ${{ env.CONTAINER }} || true
