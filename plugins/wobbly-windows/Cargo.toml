[package]
name = "wobbly-windows"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Wobbly windows for miracle-wm: windows wobble as they slide, then settle"

[lib]
# Plugins are loaded by the compositor as WebAssembly modules.
crate-type = ["cdylib"]

[dependencies]
glam = "0.29"
miracle-plugin = { path = "../../miracle-plugin-rs" }
