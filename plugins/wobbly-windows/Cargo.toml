[package]
name = "wobbly-windows"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Wobbly windows effect for miracle-wm, implemented with a per-window geometry shader"

[lib]
# Plugins are loaded by the compositor as WebAssembly modules.
crate-type = ["cdylib"]

[dependencies]
miracle-plugin = { path = "../../miracle-plugin-rs" }
