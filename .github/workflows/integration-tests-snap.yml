name: Integration Tests (Snap)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number && format('pr{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

env:
  CONTAINER: miracle-visual-snap

jobs:
  visual-tests-snap:
    runs-on: ubuntu-latest
    name: Visual Integration Tests (snap)
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: build-snap
        name: Build snap
        uses: canonical/actions/build-snap@release
        with:
          snapcraft-channel: candidate
          review-opts: "--allow-classic"

      - name: Store the snap as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snap.outputs.snap-name }}
          path: ${{ steps.build-snap.outputs.snap-path }}

      - name: Install podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y podman

      - name: Start Ubuntu 26.04 container
        run: |
          podman run -d --name ${{ env.CONTAINER }} \
            -v ${{ github.workspace }}:/workspace:z \
            --workdir /workspace \
            ubuntu:26.04 \
            sleep infinity

      - name: Install test dependencies
        run: |
          podman exec ${{ env.CONTAINER }} bash -c "
            set -e
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -yq \
              python3 python3-venv python3-pip \
              squashfs-tools dpkg-dev \
              gedit gnome-chess grim
          "

      - name: Unpack built snap
        run: |
          podman exec ${{ env.CONTAINER }} bash -c "
            set -e
            rm -rf /workspace/miracle-snap
            snap_file=\$(find /workspace -maxdepth 1 -name '*.snap' -type f | head -n1)
            if [ -z \"\$snap_file\" ]; then
              echo \"No .snap file found in /workspace\" >&2
              ls -la /workspace >&2
              exit 1
            fi
            echo \"Unpacking snap: \$snap_file\"
            unsquashfs -f -d /workspace/miracle-snap \"\$snap_file\"
          "

      - name: Create snap launcher script
        run: |
          podman exec ${{ env.CONTAINER }} bash -c "
            set -e
            cat > /workspace/run-miracle-from-snap.sh <<'EOF'
            #!/usr/bin/env bash
            set -e

            SNAP=/workspace/miracle-snap
            ARCH_TRIPLET=\$(dpkg-architecture -qDEB_HOST_MULTIARCH)

            export SNAP
            export PATH=\"\$SNAP/bin:\$SNAP/usr/bin:\$SNAP/usr/local/bin:\$PATH\"
            export LD_LIBRARY_PATH=\"\$SNAP/usr/lib/\$ARCH_TRIPLET:\$SNAP/lib/\$ARCH_TRIPLET:\$SNAP/usr/lib:\$SNAP/lib:\${LD_LIBRARY_PATH:-}\"
            export MIR_SERVER_PLATFORM_PATH=\"\$SNAP/usr/lib/\$ARCH_TRIPLET/mir/server-platform\"
            export __EGL_VENDOR_LIBRARY_DIRS=\"\$SNAP/etc/glvnd/egl_vendor.d:\$SNAP/usr/share/glvnd/egl_vendor.d\"
            export GBM_BACKENDS_PATH=\"\$SNAP/usr/lib/\$ARCH_TRIPLET/gbm\"
            export LIBGL_DRIVERS_PATH=\"\$SNAP/usr/lib/\$ARCH_TRIPLET/dri\"
            export LIBINPUT_QUIRKS_DIR=\"\$SNAP/usr/share/libinput\"
            export DRIRC_CONFIGDIR=\"\$SNAP/usr/share/drirc.d\"

            exec \"\$SNAP/usr/bin/miracle-wm\" \"\$@\"
            EOF
            chmod +x /workspace/run-miracle-from-snap.sh
          "

      - name: Install Python e2e test deps
        run: |
          podman exec ${{ env.CONTAINER }} bash -c "
            set -e
            cd /workspace/e2e
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
          "

      - name: Run visual e2e tests against snap binary
        run: |
          podman exec \
            -e XDG_RUNTIME_DIR=/tmp/miracle-e2e \
            -e MIRACLE_VISUAL_TEST_BIN=/workspace/run-miracle-from-snap.sh \
            -e MIRACLE_SCREENSHOT_DIR=/workspace/screenshots-snap \
            -e MIRACLE_PLATFORM_DISPLAY_LIBS=mir:virtual \
            -e MIR_SERVER_VIRTUAL_OUTPUT=800x600 \
            ${{ env.CONTAINER }} bash -c "
              set -eo pipefail
              mkdir -p /tmp/miracle-e2e
              chmod 700 /tmp/miracle-e2e
              mkdir -p /workspace/screenshots-snap
              cd /workspace/e2e
              . venv/bin/activate
              pytest visual/ -v --tb=short 2>&1 | tee /workspace/screenshots-snap/test-output.txt
            "

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-snap-screenshots-${{ github.run_number }}
          path: ${{ github.workspace }}/screenshots-snap/
          retention-days: 30
          if-no-files-found: warn

      - name: Stop container
        if: always()
        run: |
          podman stop ${{ env.CONTAINER }} || true
          podman rm ${{ env.CONTAINER }} || true
