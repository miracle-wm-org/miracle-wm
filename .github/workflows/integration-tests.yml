name: Integration Tests

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  BUILD_TYPE: Debug
  CONTAINER: miracle-visual

jobs:

  visual-tests:
    runs-on: ubuntu-24.04
    name: Visual Integration Tests
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3

    - name: Install podman
      run: |
        sudo apt-get update -q
        sudo apt-get install -y podman

    - name: Start Ubuntu 26.04 container
      run: |
        podman run -d --name ${{ env.CONTAINER }} \
          -v ${{ github.workspace }}:/workspace:z \
          --workdir /workspace \
          ubuntu:26.04 \
          sleep infinity

    - name: Add PPA
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          apt-get update -q
          apt-get install -yq software-properties-common
          add-apt-repository ppa:mir-team/release
          apt-get update -q
        "

    - name: Install dependencies
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            gcc g++ cmake ninja-build python3 python3-venv curl \
            libmiral-dev libmircommon-dev libmirserver-internal-dev \
            libgtest-dev libyaml-cpp-dev libglib2.0-dev libevdev-dev nlohmann-json3-dev \
            libnotify-dev pcre2-utils libmiroil-dev libmirplatform-dev libgles2-mesa-dev \
            libmirwayland-dev libjson-c-dev libgmock-dev mirtest-dev mirtest-internal-dev \
            mir-wlcs-integration libxkbcommon-dev libboost-filesystem-dev libboost-system-dev \
            libwasmedge-dev grim
          DEBIAN_FRONTEND=noninteractive apt-get install -yq libmirrenderer-dev || true
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            mir-platform-graphics-virtual xwayland \
            mir-platform-rendering-egl-generic gedit gnome-chess
        "

    - name: Install Rust
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . /root/.cargo/env
          rustup target add wasm32-unknown-unknown
        "

    - name: Configure CMake
      run: |
        podman exec ${{ env.CONTAINER }} \
          cmake -B /workspace/build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DEND_TO_END_TESTS=1 \
            -DENABLE_TESTS=OFF

    - name: Build
      run: podman exec ${{ env.CONTAINER }} cmake --build /workspace/build --config ${{ env.BUILD_TYPE }}

    - name: Install
      run: |
        podman exec ${{ env.CONTAINER }} cmake --install /workspace/build --config ${{ env.BUILD_TYPE }}
        podman exec ${{ env.CONTAINER }} ldconfig

    - name: Install Python e2e test deps
      run: |
        podman exec ${{ env.CONTAINER }} bash -c "
          set -e
          cd /workspace/e2e
          python3 -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
        "

    - name: Run e2e tests
      run: |
        podman exec \
          -e XDG_RUNTIME_DIR=/tmp/miracle-e2e \
          -e MIRACLE_VISUAL_TEST_BIN=/usr/local/bin/miracle-wm \
          -e MIRACLE_SCREENSHOT_DIR=/workspace/screenshots \
          -e MIRACLE_PLATFORM_DISPLAY_LIBS=mir:virtual \
          -e MIR_SERVER_VIRTUAL_OUTPUT=800x600 \
          ${{ env.CONTAINER }} bash -c "
            set -eo pipefail
            mkdir -p /tmp/miracle-e2e
            chmod 700 /tmp/miracle-e2e
            mkdir -p /workspace/screenshots
            cd /workspace/e2e
            . venv/bin/activate
            pytest visual/ -v --tb=short 2>&1 | tee /workspace/screenshots/test-output.txt
          "

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-test-screenshots-${{ github.run_number }}
        path: ${{ github.workspace }}/screenshots/
        retention-days: 30
        if-no-files-found: warn

    - name: Stop container
      if: always()
      run: |
        podman stop ${{ env.CONTAINER }} || true
        podman rm ${{ env.CONTAINER }} || true
